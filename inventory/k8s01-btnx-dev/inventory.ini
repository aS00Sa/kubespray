# k8s01-btnx-dev — HA: 3 control-plane (stacked etcd) + 3 workers
#
# Публичные IP на интерфейсе ens19 (на всех нодах; см. group_vars/all/network_public.yml):
#   155.212.177.145 — VIP master (Keepalived на m1/m2/m3, ens19), API :6443 (не access_ip).
#   155.212.177.146–148 — на ens19 workers (статика или MetalLB L2).
#
# ansible_host / ip = 192.168.25.x (etcd, Calico, API между нодами).
# access_ip — только workers. На masters НЕ задавать — ломает etcd.
# SAN apiserver + kubeconfig: loadbalancer_apiserver.address = 145 в group_vars/all/all.yml
#
# Keepalived + cert-manager на CP — вне Kubespray; MetalLB (если нужен) — отдельный внутренний пул, не 145.

[kube_control_plane]
# Без access_ip; VIP 145 объявляется Keepalived, не через inventory.
k8s01-btnx-dev-m1 ansible_host=192.168.25.61 ip=192.168.25.61 etcd_member_name=etcd1
k8s01-btnx-dev-m2 ansible_host=192.168.25.62 ip=192.168.25.62 etcd_member_name=etcd2
k8s01-btnx-dev-m3 ansible_host=192.168.25.63 ip=192.168.25.63 etcd_member_name=etcd3

[etcd:children]
kube_control_plane

[kube_node]
# Статические белые IP на серверах workers (apps / NodePort).
k8s01-btnx-dev-w1 ansible_host=192.168.25.64 access_ip=155.212.177.148 ip=192.168.25.64
k8s01-btnx-dev-w2 ansible_host=192.168.25.65 access_ip=155.212.177.146 ip=192.168.25.65
k8s01-btnx-dev-w3 ansible_host=192.168.25.66 access_ip=155.212.177.147 ip=192.168.25.66

[all:vars]
ansible_user=root
ansible_become=true
app_domain_name=dvsprtbt.ru
